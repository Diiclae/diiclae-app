name: Diiclae CI/CD Pipeline

on:
  push:
    branches:
      - diiclae-ai-dev
      - staging

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up Java and Kotlin
      if: contains(github.repository, 'diiclae-app')
      uses: actions/setup-java@v2
      with:
        java-version: '17'

    - name: Build Android App
      if: contains(github.repository, 'diiclae-app')
      run: ./gradlew build

    - name: Set up Swift
      if: contains(github.repository, 'diiclae-app')
      run: xcodebuild -project Diiclae.xcodeproj -scheme Diiclae

    - name: Run Backend Tests
      if: contains(github.repository, 'dev-backend-api')
      run: dotnet test

    - name: Deploy to Staging
      run: |
        aws s3 sync ./build s3://diiclae-staging

  approval:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
    - name: Manual Approval Required
      uses: hmarr/auto-approve-action@v2
      with:
        github-token: ${{ secrets.DIICLAE_GH_TOKEN }}
